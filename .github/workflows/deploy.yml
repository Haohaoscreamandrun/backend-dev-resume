name: Deploy GitHub Pages & Compile CV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install TeX Live and fonts
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            fonts-texgyre \
            fonts-freefont-ttf \
            fonts-noto-cjk
          sudo fc-cache -f

      - name: Compile CV PDFs with XeLaTeX
        run: |
          cd cv
          xelatex -interaction=nonstopmode CV_Hao_Chen.tex
          xelatex -interaction=nonstopmode CV_Hao_Chen_zh.tex
          # Clean auxiliary files
          rm -f *.aux *.log *.out

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
